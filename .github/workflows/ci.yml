# Her itmede (push) ve her PR'da çalışan doğrulama.
#
# Bu iş yeşil değilse kod birleştirilmez. "Otonom kod güncellemesi"nin
# güvenli hâli budur: değişikliği makine önerir, testler doğrular, insan
# birleştirir. Denetimsiz otomatik dağıtım, para taşıyan bir sistemde
# hızlandırdığından çok daha fazlasını riske atar.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# ----------------------------------------------------------------------------
# JETON YETKISI: MINIMUM
# ----------------------------------------------------------------------------
# Bu is akisi `pull_request` uzerinde de calisir ve depo HERKESE ACIK: bir
# catal (fork) PR'i, calistiricida bizim kontrolumuz disindaki kodu
# calistirir (`npm ci` bagimlilik betikleri dahil). Is akisinda hicbir sir
# yok -- bu kasitli ve korunmasi gereken bir ozellik. `permissions` da
# acikca yaziliyor ki depo varsayilani ileride gevsetilse bile bu is akisi
# yalnizca okuyabilsin.
# ----------------------------------------------------------------------------
# EYLEMLER COMMIT SHA'SINA SABITLENDI
# ----------------------------------------------------------------------------
# `actions/checkout@v4` bir SURUM degil TAKMA ADDIR: bakimci her yeni yayinda
# `v4` etiketini tasir. Yani dun denetledigimiz kod, bugun haber vermeden
# baska bir kod olabilir. Eylem deposu ele gecirilirse -- ya da bir bakimci
# hesabi -- degisiklik bize hicbir sinyal vermeden calistiriciya iner.
#
# Sabitlenen SHA'lar `git ls-remote` ile DOGRULANDI ve her ikisi de o an
# `v4` takma adinin gosterdigi commit ile birebir ayni:
#   actions/checkout   11d5960... = v4.4.0
#   actions/setup-node 49933ea... = v4.4.0
# Yani sabitleme davranisi degistirmiyor; yalnizca degisebilir olani
# sabitliyor.
#
# Sabitlemenin bilinen bedeli guncellemelerin donmasidir; onu
# `.github/dependabot.yml` odiyor: yeni surum ciktiginda SHA'yi guncelleyen
# bir PR acilir ve degisiklik insan incelemesinden gecer.
# ----------------------------------------------------------------------------

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ohaaaa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # checkout varsayilan olarak GITHUB_TOKEN'i `.git/config`'e yazar
          # ve sonraki her adim onu okuyabilir -- `npm ci` sirasinda calisan
          # ucuncu taraf postinstall betikleri dahil. Bu is hicbir yere itme
          # yapmiyor; jetonun diskte durmasi gereksiz maruziyet.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tip denetimi
        run: npm run typecheck

      # Lint CI'da YOKTU ve bu bir kez gercek bir hatayi kacirdi: 'use server'
      # dosyasindan nesne disa aktarilmisti; tsc temiz gecti, yakalayan derleme
      # oldu. Bir baskasinda da efekt icinde setState uyarisi yalnizca lint'te
      # gorundu.
      - name: Lint
        run: npm run lint

      # Marka yazimi gozle yakalanmaz: uc a ile dort a arasindaki fark tek
      # harf ve okurken beyin dogrusunu gorur. Bir kez yanlis yazilip
      # kopyalandiginda sessizce yayilir -- e-postaya, bildirime, meta
      # etiketine. Sayan makine olmali. Dogrusu: O + dort a.
      - name: Marka yazimi
        run: npm run verify:brand

      # Sir sizintisinin en pahali hali fark edilmeden commit edilenidir:
      # dosya sonradan silinse bile deger git gecmisinde kalir ve anahtarin
      # dondurulmesi gerekir. Kontrol bu yuzden commit'ten SONRA degil,
      # her derlemede yapilir.
      - name: Sir taramasi
        run: npm run verify:secrets

      - name: Birim testleri
        run: npm test

      # SQL paketi pgTAP iddialarıyla yazılmıştır ve `postgres:16` imajı bunu
      # İÇERMEZ. Eksikliği sessiz değil, ölümcül: 00_supabase_shim.sql'deki
      # `create extension pgtap` düşer ve tüm SQL adımı ilk saniyede biter.
      #
      # Bu, geliştirici makinesinde pgTAP kurulu olduğu için YEREL koşuda
      # görünmüyordu -- yerel yeşil, CI kırmızıydı. Eklentiyi burada kurmak
      # farkı kapatıyor: kaynak imaj değişmiyor, kap içinde tek paket.
      - name: pgTAP eklentisini veritabanı kabına kur
        run: |
          cid="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then
            echo "postgres:16 servis kabı bulunamadı" >&2
            exit 1
          fi
          docker exec "$cid" bash -c \
            'apt-get update -qq && apt-get install -y -qq postgresql-16-pgtap'

      - name: SQL migration ve güvenlik testleri
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ohaaaa_test
          PGPASSWORD: postgres
        run: ./scripts/verify-sql.sh

      - name: Derleme
        run: npm run build
