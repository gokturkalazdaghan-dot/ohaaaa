# ============================================================================
# Otonom alım döngüsü
# ----------------------------------------------------------------------------
# "Otonom ajan" pratikte budur: zamanlanmış, deterministik, günlüğü tutulan
# ve çıkış kodu izlenen bir iş. Sürekli çalışan bir süreç DEĞİLDİR — çöktüğünde
# sessizce durup kimsenin fark etmediği şey odur.
#
# Her çalışma:
#   • ingest_runs tablosuna kaydedilir (ne zaman, kaç kalem, hangi hata)
#   • başarısızsa iş kırmızı olur ve bildirim gider
#   • katalog asla sessizce boşalmaz (boş feed = hata, bkz. pipeline.ts)
# ============================================================================

name: Ürün alımı

on:
  schedule:
    # Her 6 saatte bir. Ortaklık feed'leri bundan sık güncellenmez;
    # daha sık çekmek yalnızca kaynağı yorar.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Yalnızca bu kaynağı çalıştır (slug)'
        required: false
      dry_run:
        description: 'Veritabanına yazmadan dene'
        type: boolean
        default: false
      awin_feed_listesi:
        description: 'Awin feed listesini KEŞFET (yalnızca okur, yazmaz)'
        type: boolean
        default: false

# ----------------------------------------------------------------------------
# JETON YETKISI: MINIMUM
# ----------------------------------------------------------------------------
# `permissions` yazilmadiginda depo ayarindaki VARSAYILAN uygulanir ve o
# varsayilan yazma yetkisi tasiyabilir. Bu is yalnizca kodu okur; issue
# acmaz, paket yayinlamaz, commit atmaz. Yetkiyi burada sabitlemek, depo
# ayari ileride gevsetilse bile bu is akisini etkilemez.
# ----------------------------------------------------------------------------
# EYLEMLER COMMIT SHA'SINA SABITLENDI
# ----------------------------------------------------------------------------
# `actions/checkout@v4` bir SURUM degil TAKMA ADDIR: bakimci her yeni yayinda
# `v4` etiketini tasir. Yani dun denetledigimiz kod, bugun haber vermeden
# baska bir kod olabilir. Eylem deposu ele gecirilirse -- ya da bir bakimci
# hesabi -- degisiklik bize hicbir sinyal vermeden calistiriciya iner.
#
# Sabitlenen SHA'lar `git ls-remote` ile DOGRULANDI ve her ikisi de o an
# `v4` takma adinin gosterdigi commit ile birebir ayni:
#   actions/checkout   11d5960... = v4.4.0
#   actions/setup-node 49933ea... = v4.4.0
# Yani sabitleme davranisi degistirmiyor; yalnizca degisebilir olani
# sabitliyor.
#
# Sabitlemenin bilinen bedeli guncellemelerin donmasidir; onu
# `.github/dependabot.yml` odiyor: yeni surum ciktiginda SHA'yi guncelleyen
# bir PR acilir ve degisiklik insan incelemesinden gecer.
# ----------------------------------------------------------------------------

permissions:
  contents: read

concurrency:
  # Bir önceki çalışma bitmediyse yenisi başlamaz: aynı mağazaya eşzamanlı
  # istek göndermek nezaket ayarlarını anlamsız kılar.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    # KESIF SECILDIYSE ALIM TURU CALISMAZ.
    # `inputs` yalnizca workflow_dispatch'te doludur; `schedule`
    # tetiklemesinde bos gelir ve `!` onu true'ya cevirir -- yani
    # zamanlanmis tur bu kosuldan ETKILENMEZ.
    if: ${{ !inputs.awin_feed_listesi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # VARSAYILAN DAVRANIS: checkout, GITHUB_TOKEN'i `.git/config`
          # icine yazar ve sonraki HER adim onu okuyabilir -- `npm ci`
          # sirasinda calisan ucuncu taraf postinstall betikleri dahil.
          # Bu is hicbir yere itme yapmadigi icin jetonun diskte durmasi
          # yalnizca gereksiz bir maruziyet.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @ohaaaa/shared
      - run: npm run build --workspace @ohaaaa/ingest

      # ZAMANLAYICI KIPI (--schedule)
      #
      # Onceki hal her calismada TUM etkin kaynaklari sirayla aliyordu.
      # Artik yalnizca `next_refresh_at <= now()` olanlar kuyruga giriyor
      # ve worker onlari isliyor. Fiyati gunde bes kez degisen bir urun
      # ile yilda bir degisen bir yedek parca artik ayni muameleyi
      # gormuyor.
      #
      # DURUSTCE BIR SINIR: bu is 6 saatte bir tetikleniyor, dolayisiyla
      # uyarlanabilir planin onerdigi 5 dakikalik araliklar PRATIKTE 6
      # saatte bir uygulanabiliyor. Cron sikligi, planin tavani. Daha sik
      # tetikleme bir maliyet karari; kod tarafi hazir.
      #
      # Elle tek kaynak calistirmak icin eski dogrudan kip korundu:
      # `--source=<slug>` verildiginde zamanlayici atlanir.
      - name: Alımı çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OHAAAA_USER_AGENT: 'OhaaaaBot/1.0 (+https://ohaaaa.com/bot; iletisim@ohaaaa.com)'
          # Ortaklık feed'i jetonları. `sources.endpoint_url` sütununda yalnızca
          # ${DEGISKEN_ADI} yer tutucusu durur; gerçek değer buradan gelir ve
          # veritabanına hiç yazılmaz. Depo sırrı tanımlı değilse boş gelir ve
          # yer tutucu kullanan kaynak açık bir hatayla durur -- sessizce
          # kimliksiz istek atıp 401'i "ağ arızası" sanmaz.
          #
          # ADLAR KODDA DEĞİL VERİDE. `expandSecretPlaceholders` generic'tir:
          # adresteki ${AD} kalıbını yakalar ve ortamdan okur. Yani hangi
          # değişkenin gerekli olduğunu `sources.endpoint_url` ile
          # `sources.auth_secret_ref` söyler, kod değil. Buraya eklenen her
          # satır o veriyle EŞLEŞMEK zorundadır.
          #
          # AWIN_DATAFEED_API_KEY: `bto-instock` kaynağının talep ettiği ad.
          # Ölçüldü (üretim): endpoint yer tutucusu ${AWIN_DATAFEED_API_KEY},
          # auth_secret_ref = 'AWIN_DATAFEED_API_KEY'. Bu satır yokken alım
          # CONFIG_ERROR ile duruyordu:
          #   "Kaynak adresindeki gizli değişken(ler) ortamda tanımlı değil:
          #    AWIN_DATAFEED_API_KEY"
          AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}
          # OHAAAA_FEED_TOKEN: jenerik ad; şu anda hiçbir kaynak bunu talep
          # etmiyor. Bilerek KORUNUYOR -- ileride bu adı kullanan bir kaynak
          # eklenirse hazır dursun ve silinmesi ayrı bir karar olsun.
          OHAAAA_FEED_TOKEN: ${{ secrets.OHAAAA_FEED_TOKEN }}
          # KULLANICI GIRDISI KABUKA DEGIL ORTAMA GIRER.
          #
          # Onceki hal `${{ inputs.source }}` degerini dogrudan `run:`
          # betiginin METNINE gomuyordu. GitHub ifadeleri kabuk calismadan
          # ONCE metin olarak yerine konur; yani `; curl ...` yazan bir
          # girdi komutun kendisi haline gelirdi. Ustelik ayni adimin
          # ortaminda SUPABASE_SERVICE_ROLE_KEY duruyor -- yani enjeksiyon
          # dogrudan sir sizintisina cevrilebilirdi.
          #
          # `workflow_dispatch` yazma yetkisi gerektirdigi icin somuru
          # yuzeyi dardi, ama bu bir savunma degil: ele gecirilmis bir
          # jeton ya da bir isbirlikcinin hatasi ayni yolu acar.
          #
          # Duzeltme GitHub'in kendi onerdigi kalip: deger `env:` ile
          # aktarilir, kabukta TIRNAK ICINDE degisken olarak okunur ve
          # hicbir zaman betik metnine karismaz.
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Ikinci katman: slug bicimi denetlenir. Tirnak zaten enjeksiyonu
          # kesiyor; bu, bicimsiz bir degerin CLI'ya ulasmasini da engeller.
          if [ -n "${INPUT_SOURCE:-}" ]; then
            if ! printf '%s' "$INPUT_SOURCE" | grep -qE '^[A-Za-z0-9._-]{1,64}$'; then
              echo "Gecersiz kaynak slug'i. Izinli: harf, rakam, nokta, alt tire, tire (1-64)." >&2
              exit 1
            fi
            args=("--source=${INPUT_SOURCE}")
          else
            args=("--schedule")
          fi

          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            args+=("--dry-run")
          fi

          node packages/ingest/dist/cli.js "${args[@]}"

      # ----------------------------------------------------------------------
      # KATALOG ÖNBELLEĞİNİ BOŞALT
      # ----------------------------------------------------------------------
      # `/api/cron/katalog-tazele` deponun içinde VARDI ama onu çağıran
      # hiçbir yer yoktu: Vercel cron listesinde değil (Hobby'de iki slot
      # var, ikisi de dolu) ve bu iş akışında da yoktu. Yani `katalog`
      # etiketi üretimde HİÇ boşaltılmıyordu.
      #
      # Ölçülen bedeli `apps/web/src/data/onbellek.ts` başında yazılı:
      # 34.722 ürün grubu yeni kategorilerine taşındıktan ve site iki kez
      # yeniden dağıtıldıktan SONRA bile üst çubuk eski ağacı sunmaya devam
      # etti. Vercel'in veri önbelleği dağıtımla temizlenmiyor; elde
      # beklemekten başka kaldıraç yoktu.
      #
      # ALIMDAN SONRA, ÇÜNKÜ SIRALAMA ÖNEMLİ: önce boşaltılsaydı önbellek
      # ESKİ veriyle yeniden dolardı ve hiçbir şey kazanılmazdı.
      #
      # SIR YOKSA ATLANIR AMA SUSULMAZ. `CRON_SECRET` depo sırrı olarak
      # tanımlı değilse adım açık bir satır yazıp geçer. Sessizce atlamak,
      # tam da bu dosyanın düzelttiği arıza türü olurdu: "çalışıyor görünen
      # ama hiçbir şey yapmayan adım".
      #
      # SIR ARGÜMANA GİRMİYOR. `curl --config` ile dosyadan okunuyor;
      # komut satırına yazılsaydı değer, çalıştırıcıdaki süreç listesinde
      # görünebilirdi. GitHub log maskelemesi bir savunma katmanıdır,
      # tek katman değil.
      - name: Katalog önbelleğini boşalt
        if: success()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.OHAAAA_SITE_URL || 'https://www.ohaaaa.com' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET depo sirri tanimli degil -- onbellek bosaltma ATLANDI."
            echo "Katalog degisiklikleri vitrine ancak onbellek suresi dolunca yansir."
            exit 0
          fi

          cfg="${RUNNER_TEMP}/katalog-tazele.curl"
          umask 077
          printf 'header = "authorization: Bearer %s"\n' "$CRON_SECRET" > "$cfg"
          trap 'rm -f "$cfg"' EXIT

          curl -fsS -X POST "${SITE_URL%/}/api/cron/katalog-tazele" \
            --config "$cfg" -o /dev/null
          echo "Katalog onbellegi bosaltildi."

  # ==========================================================================
  # AWIN FEED LİSTESİ KEŞFİ -- AYRI İŞ, ALIM YOLUNA DOKUNMAZ
  # --------------------------------------------------------------------------
  # NEDEN AYRI İŞ: çalışan alım yolunu değiştirmemek için. Bu iş yalnızca
  # elle tetiklenir, `concurrency: ingest` grubuna girmez ve alım turuyla
  # yarışmaz.
  #
  # SUPABASE SIRLARI BİLEREK YOK. Keşif hiçbir şey yazmaz; service-role
  # anahtarını bu işin ortamına koymak, okuma işine yazma yetkisi vermek
  # olurdu. Sızıntı yüzeyi kadar, yanlışlıkla yazma ihtimali de kapanıyor.
  # ==========================================================================
  awin-kesif:
    if: inputs.awin_feed_listesi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @ohaaaa/shared
      - run: npm run build --workspace @ohaaaa/ingest

      - name: Awin feed listesini keşfet
        env:
          # Alım turunun kullandığı ANAHTARIN AYNISI. `bto-instock` bu
          # anahtarla 35.556 ürün çekiyor -- yani değerin geçerliliği
          # üretimde zaten kanıtlı.
          AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${AWIN_DATAFEED_API_KEY:-}" ]; then
            echo "AWIN_DATAFEED_API_KEY depo sirri tanimli degil." >&2
            exit 1
          fi

          # Cikti maskelenmis: anahtar yolda durur, redact() onu siler.
          node packages/ingest/dist/cli.js --awin-feed-listesi
