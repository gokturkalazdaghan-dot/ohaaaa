<!doctype html>
<!--
  Çevrimdışı kapak sayfası.

  Servis çalışanı bunu YALNIZCA ağ tamamen başarısız olduğunda gösterir.
  Next.js'ten geçmez, bu yüzden düz HTML ve satır içi stil: kurulum
  sırasında önbelleğe alınan tek dosya bu olmalı, ek bir CSS dosyası daha
  önbelleklemek eskimiş bir stilin kalıcılaşması riskini getirirdi.

  Renkler globals.css içindeki --bg / --text / --brand-cta ile aynı.
-->
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bağlantı yok · Ohaaaa</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12100e" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf6f1;
        color: #1a1613;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.25rem; margin: 20px 0 8px; }
      p { margin: 0; font-size: 0.9375rem; line-height: 1.6; opacity: 0.7; }
      /*
        Satır içi `onclick` YOK: bu sayfa önbellekten dönerken üzerinde
        nonce'lu bir CSP başlığı taşıyabilir ve nonce varken tarayıcı
        'unsafe-inline' yazsa bile satır içi işleyicileri çalıştırmaz.
        Yani düğme sessizce ölü kalırdı. Bağlantı hiç betik istemiyor:
        çevrimdışıyken yeniden çevrimdışı sayfasına düşer, bağlantı
        gelince ana sayfayı açar.
      */
      a {
        display: inline-block;
        margin-top: 24px;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 600;
        text-decoration: none;
        color: #fff;
        background: #b84f14;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #12100e; color: #f2ede7; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/marka/ohaaaa-arma-192.png" alt="Ohaaaa" width="64" height="64" />
      <h1>Bağlantı yok</h1>
      <p>
        Fiyatlar anlık olarak mağazalardan geliyor, bu yüzden çevrimdışı
        gösterilemiyor. Bağlantın geri geldiğinde kaldığın yerden devam
        edebilirsin.
      </p>
      <a href="/">Tekrar dene</a>
    </main>
  </body>
</html>
